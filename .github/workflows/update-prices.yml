name: Actualizar precios LaLiga Fantasy

on:
  schedule:
    # 01:23 UTC = 03:23 o 02:23 hora española según horario de verano/invierno.
    # El mercado de futbolfantasy se actualiza pasada la medianoche española,
    # así que dejamos margen para que ya esté publicado.
    - cron: "23 1 * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt
          npm ci

      - name: Scrapear mercado, puntos y calendario de hoy
        run: |
          python scraper/scrape_market.py
          python scraper/scrape_points.py
          LATEST_MERCADO=$(ls -t scraper/data/raw/mercado_*.json | head -n 1)
          python scraper/scrape_fixtures.py "$LATEST_MERCADO"

      # Las cuotas son un extra: si football-data no responde, el resto de la
      # actualización sigue adelante y el front cae a su estimación.
      - name: Descargar cuotas 1X2 de los próximos partidos
        continue-on-error: true
        run: |
          LATEST_MERCADO=$(ls -t scraper/data/raw/mercado_*.json | head -n 1)
          python scraper/scrape_odds.py "$LATEST_MERCADO"

      # Estado deportivo y estadísticas reales: son un extra, si una de las
      # dos páginas falla el resto de la actualización sigue adelante.
      - name: Scrapear lesiones/sanciones y estadísticas por equipo
        continue-on-error: true
        run: |
          python scraper/scrape_status.py
          python scraper/scrape_stats.py

      - name: Fusionar mercado, puntos, estado y estadísticas en jugadores.json
        run: |
          LATEST_MERCADO=$(ls -t scraper/data/raw/mercado_*.json | head -n 1)
          LATEST_PUNTOS=$(ls -t scraper/data/raw/puntos_*.json | head -n 1)
          LATEST_ESTADISTICAS=$(ls -t scraper/data/raw/estadisticas_*.json 2>/dev/null | head -n 1)
          LATEST_ESTADO=$(ls -t scraper/data/raw/estado_*.json 2>/dev/null | head -n 1)
          python scraper/merge_history.py "$LATEST_MERCADO" "$LATEST_PUNTOS" $LATEST_ESTADISTICAS $LATEST_ESTADO

      - name: Scrapear puntos por jornada (una petición por jugador, ~5-10 min)
        run: python scraper/scrape_matchday_points.py scraper/data/jugadores.json

      - name: Fusionar jornadas y calendario
        run: |
          LATEST_JORNADAS=$(ls -t scraper/data/raw/jornadas_*.json | head -n 1)
          LATEST_CALENDARIO=$(ls -t scraper/data/raw/calendario_*.json | head -n 1)
          LATEST_CUOTAS=$(ls -t scraper/data/raw/cuotas_*.json 2>/dev/null | head -n 1)
          python scraper/merge_history.py "$LATEST_JORNADAS"
          python scraper/build_calendar.py "$LATEST_CALENDARIO" $LATEST_CUOTAS

      - name: Subir a Neon (el front lee de /api/players y /api/fixtures)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scraper/sync_to_neon.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/data
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          DIA=$(date -u +%-d)
          MES=${MESES[$(( $(date -u +%-m) - 1 ))]}
          ANIO=$(date -u +%Y)
          git diff --staged --quiet || git commit -m "Datos actualizados día $DIA de $MES de $ANIO"
          git push
